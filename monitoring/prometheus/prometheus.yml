global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: car_park
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend-1:8080"]
        labels:
          application: car_park

  - job_name: car_park_bot
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["car_park_bot:8090"]
        labels:
          application: car_park_bot

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: promtail
    static_configs:
      - targets: ["promtail:9080"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
