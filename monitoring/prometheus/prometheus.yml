global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: car_park
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend-1:8080"]
        labels:
          application: car_park

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
