apiVersion: 1


policies:
  - orgId: 1
    receiver: info
    group_by: ['grafana_folder', 'alertname', 'severity']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 12h
    routes:
      - receiver: heartbeat
        object_matchers:
          - ['alertname', '=', 'Watchdog']
        group_wait: 0s
        group_interval: 24h
        repeat_interval: 24h

      - receiver: critical
        object_matchers:
          - ['severity', '=', 'critical']
        group_wait: 10s
        group_interval: 2m
        repeat_interval: 1h

      - receiver: warning
        object_matchers:
          - ['severity', '=', 'warning']
        group_wait: 1m
        group_interval: 10m
        repeat_interval: 6h
        mute_time_intervals: ['night']

      - receiver: info
        object_matchers:
          - ['severity', '=', 'info']
        group_wait: 5m
        group_interval: 30m
        repeat_interval: 24h
        mute_time_intervals: ['night']
