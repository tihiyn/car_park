server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    batchwait: 1s
    batchsize: 1048576

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
        filters:
          - name: network
            values: ["app_network"]
    relabel_configs:
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'compose_service'
      - source_labels: ['compose_service']
        regex: 'promtail|loki|backend-1|nginx'
        action: drop
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'
      - target_label: 'job'
        replacement: 'docker'
    pipeline_stages:
      - match:
          selector: '{compose_service="db"}'
          stages:
            - regex:
                expression: '^(?P<pg_ts>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d{3} \S+) \[(?P<pg_pid>\d+)\] (?:(?P<pg_user>[^@\s]+)@(?P<pg_db>\S+) )?(?P<pg_severity>DEBUG[1-5]|INFO|NOTICE|WARNING|ERROR|LOG|FATAL|PANIC):'
            - labels:
                pg_severity:

  - job_name: car_park_app
    static_configs:
      - targets: [localhost]
        labels:
          job: car_park_app
          application: car_park
          __path__: /var/log/car_park/car_park-*.log
          __path_exclude__: /var/log/car_park/car_park-*.[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9].log
    pipeline_stages:
      - json:
          expressions:
            level: level
            ts: '"@timestamp"'
      - labels:
          level:
      - timestamp:
          source: ts
          format: RFC3339Nano
          action_on_failure: skip

  - job_name: nginx_access
    static_configs:
      - targets: [localhost]
        labels:
          job: nginx
          stream: access
          __path__: /var/log/nginx/access.log

  - job_name: nginx_error
    static_configs:
      - targets: [localhost]
        labels:
          job: nginx
          stream: error
          __path__: /var/log/nginx/error.log
