spring.application.name=car_park
server.error.include-message=always

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=
spring.datasource.username=
spring.datasource.password=

spring.batch.jdbc.initialize-schema=always
spring.batch.jdbc.platform=postgresql
spring.batch.job.enabled=false

security.jwt.secret-key=
security.jwt.expiration-time=

geoapify.api.key=
geoapify.api.url=https://api.geoapify.com/v1/geocode/reverse?

spring.kafka.bootstrap-servers=
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=${OTEL_TRACES_ENDPOINT:http://otel-collector:4318/v1/traces}
management.opentelemetry.resource-attributes.deployment.environment=prod
management.opentelemetry.resource-attributes.service.instance.id=${INSTANCE_ID:backend-1}

# Гистограммы нужны, чтобы в Grafana считался histogram_quantile() и рисовался heatmap
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.geoapify.address.lookup=true
management.metrics.distribution.slo.http.server.requests=50ms,100ms,200ms,500ms,1s,2s

server.tomcat.mbeanregistry.enabled=true

springdoc.packagesToScan=com.example.car_park.controllers.rest
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.with-credentials=true